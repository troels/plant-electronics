<line class="dim" x1="270" y1="515.0" x2="270" y2="467.0"/>
<line class="dim" x1="600" y1="515.0" x2="600" y2="467.0"/>
<text class="m" x="435.0" y="507.0" text-anchor="middle">about 11 cm</text></svg>

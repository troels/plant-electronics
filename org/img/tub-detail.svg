<text class="" x="215" y="96" text-anchor="end">Lid</text>
<text class="m" x="215" y="111" text-anchor="end">with a 5 cm hole for the pot</text>
<text class="m" x="215" y="126" text-anchor="end">and small holes for the rods</text>
<line class="lead" x1="221" y1="92" x2="255.0" y2="153.5"/>
<circle cx="255.0" cy="153.5" r="2" fill="var(--muted)"/>
<text class="" x="215" y="186" text-anchor="end">Light-proof wall</text>
<text class="m" x="215" y="201" text-anchor="end">black tape or paint outside,</text>
<text class="m" x="215" y="216" text-anchor="end">so no algae grow</text>
<line class="lead" x1="221" y1="182" x2="264.0" y2="230"/>
<circle cx="264.0" cy="230" r="2" fill="var(--muted)"/>
<text class="" x="215" y="276" text-anchor="end">Temperature probe</text>
<text class="m" x="215" y="291" text-anchor="end">in one tub per zone</text>
<line class="lead" x1="221" y1="272" x2="336.0" y2="320"/>
<circle cx="336.0" cy="320" r="2" fill="var(--muted)"/>
<text class="" x="215" y="352" text-anchor="end">Graphite rods</text>
<text class="m" x="215" y="367" text-anchor="end">only in tubs that get current,</text>
<text class="m" x="215" y="382" text-anchor="end">on opposite sides of the roots</text>
<line class="lead" x1="221" y1="348" x2="306.0" y2="380"/>
<circle cx="306.0" cy="380" r="2" fill="var(--muted)"/>
<text class="" x="640" y="96" text-anchor="start">Net pot and rockwool cube</text>
<text class="m" x="640" y="111" text-anchor="start">the seedling moves here</text>
<text class="m" x="640" y="126" text-anchor="start">from the nursery</text>
<line class="lead" x1="634" y1="92" x2="492.0" y2="200"/>
<circle cx="492.0" cy="200" r="2" fill="var(--muted)"/>
<text class="" x="640" y="186" text-anchor="start">Air gap</text>
<text class="m" x="640" y="201" text-anchor="start">roots here breathe;</text>
<text class="m" x="640" y="216" text-anchor="start">do not refill to the brim</text>
<line class="lead" x1="634" y1="182" x2="540" y2="224.0"/>
<circle cx="540" cy="224.0" r="2" fill="var(--muted)"/>
<text class="" x="640" y="276" text-anchor="start">Starting level</text>
<text class="m" x="640" y="291" text-anchor="start">wets the bottom centimetre</text>
<text class="m" x="640" y="306" text-anchor="start">of the pot</text>
<line class="lead" x1="634" y1="272" x2="582.0" y2="272.0"/>
<circle cx="582.0" cy="272.0" r="2" fill="var(--muted)"/>
<text class="" x="640" y="356" text-anchor="start">Level after a week or two</text>
<text class="m" x="640" y="371" text-anchor="start">top up to about halfway</text>
<line class="lead" x1="634" y1="352" x2="582.0" y2="374.0"/>
<circle cx="582.0" cy="374.0" r="2" fill="var(--muted)"/>
